<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>歌詞排版器 - Vibe Coding 版</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100%;
            background: #1a1a1a;
        }
        body {
            font-family: "Microsoft JhengHei", sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 0;
        }

        #controls {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 12px;
            width: 850px;
            margin-bottom: 20px;
            z-index: 100;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }
        input[type="text"] { width: 100%; padding: 12px; font-size: 18px; margin-bottom: 10px; box-sizing: border-box; border: 2px solid #007bff; border-radius: 6px; }
        textarea { width: 100%; height: 100px; margin-bottom: 10px; font-size: 16px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }

        #paper {
            width: 210mm;
            height: 297mm;
            min-height: 297mm;
            background: white;
            color: black;
            padding: 15mm;
            box-sizing: border-box;
            display: flex;
            gap: 12mm;
            position: relative;
            overflow: hidden;
            flex-shrink: 0;
        }

        .column {
            flex: 1;
            display: flex;
            flex-direction: column;
            white-space: pre-wrap;
            word-wrap: break-word;
            word-break: break-all;
            overflow: hidden;
            height: 100%;
        }

        .lyrics-title { font-weight: 900; margin-bottom: 0.3em; display: block; line-height: 1.1; }

        button { padding: 12px 25px; font-weight: bold; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 6px; }

        /* 贊助區塊樣式 */
        .sponsor-section {
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px dashed #ccc;
            text-align: center;
        }
        .bmc-button {
            display: inline-block;
            padding: 10px 20px;
            background-color: #FFDD00;
            color: #000000;
            border-radius: 5px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            transition: transform 0.2s;
        }
        .bmc-button:hover {
            transform: scale(1.05);
        }

        @media print {
            @page { size: A4; margin: 0; }
            body { background: white; padding: 0; margin: 0; display: block; }
            #controls { display: none; }
            #paper {
                margin: 0;
                border: none;
                box-shadow: none;
                width: 210mm;
                height: 297mm;
                padding: 15mm;
                page-break-after: avoid;
            }
        }
    </style>
</head>
<body>

<div id="controls">
    <input type="text" id="titleInput" placeholder="歌曲標題">
    <textarea id="lyricsInput" placeholder="貼上歌詞..."></textarea>
    <div style="display: flex; align-items: center;">
        <button id="calculateBtn" onclick="calculateLayout()">🚀 產生排版</button>
        <button id="printBtn" onclick="window.print()" style="background: #28a745; margin-left:10px;">🖨️ 列印</button>
        <p id="info" style="margin: 0 0 0 15px; color: #666; font-size: 14px; flex-grow: 1;"></p>
    </div>

    <div class="sponsor-section">
        <p style="margin-bottom: 10px; font-size: 14px; color: #555;">如果你覺得這個工具有幫助，歡迎給小尾巴一杯咖啡！</p>
        <a href="https://payment.ecpay.com.tw/Broadcaster/Donate/826A79A35FC09C10E7EEC356AEE997A8" target="_blank" class="bmc-button">
            ☕ Buy me a coffee
        </a>
    </div>
</div>

<div id="paper">
    <div id="col1" class="column"></div>
    <div id="col2" class="column"></div>
</div>

<script>
function testLayout(fontSize, useDouble, titleText, lines, col1, col2) {
    col1.style.fontSize = fontSize + "px";
    col2.style.fontSize = fontSize + "px";
    const mid = Math.ceil(lines.length / 2);

    const createTitle = (size) => {
        const span = document.createElement('span');
        span.className = 'lyrics-title';
        span.style.fontSize = (size + 5) + "px";
        span.textContent = titleText;
        return span;
    };

    if (useDouble) {
        col1.replaceChildren(createTitle(fontSize), document.createTextNode(lines.slice(0, mid).join('\n')));
        col2.replaceChildren(document.createTextNode(lines.slice(mid).join('\n')));
    } else {
        col1.replaceChildren(createTitle(fontSize), document.createTextNode(lines.join('\n')));
        col2.replaceChildren();
    }

    return col1.scrollHeight <= col1.offsetHeight && col2.scrollHeight <= col2.offsetHeight;
}

function calculateLayout() {
    const titleInput = document.getElementById('titleInput');
    const lyricsInput = document.getElementById('lyricsInput');
    const col1 = document.getElementById('col1');
    const col2 = document.getElementById('col2');
    const info = document.getElementById('info');

    const titleText = titleInput.value.trim();
    const lyricsText = lyricsInput.value.trim();
    if (!lyricsText) return;

    const lines = lyricsText.split('\n');
    const runTest = (s, d) => testLayout(s, d, titleText, lines, col1, col2);

    let sMin = 10, sMax = 100, bestS = 10;
    while(sMin <= sMax) {
        let m = Math.floor((sMin+sMax)/2);
        if(runTest(m, false)) { bestS = m; sMin = m+1; } else { sMax = m-1; }
    }

    let dMin = 10, dMax = 100, bestD = 10;
    while(dMin <= dMax) {
        let m = Math.floor((dMin+dMax)/2);
        if(runTest(m, true)) { bestD = m; dMin = m+1; } else { dMax = m-1; }
    }

    let finalSize, finalDouble;
    if (bestD > bestS + 4) {
        finalSize = bestD;
        finalDouble = true;
    } else {
        finalSize = bestS;
        finalDouble = false;
    }

    runTest(finalSize, finalDouble);
    info.innerText = `目前狀態：${finalDouble ? '雙欄' : '單欄'}排版 | 歌詞字體: ${finalSize}px`;
}
</script>

</body>
</html>
